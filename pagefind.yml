language: "ru"

# Для obrazslov используются .html URL ради сохранения Blogger-ссылок:
# posts = "/:year/:month/:filename.html"
# Поэтому индексируем все HTML-файлы, а не только index.html.
glob: "**/*.html"

exclude_selectors:
  - ".sticky-bottom-bar"
  - ".dock-modal-overlay"
  - ".search-overlay"
  - "#cookie-consent-banner"
